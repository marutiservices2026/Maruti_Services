# keep-alive.yml — pings the deployed backend's /health endpoint every 14 minutes so
# Render's free plan (which auto-sleeps a service after ~15 minutes with no incoming
# requests) never actually goes idle long enough to spin down. This is the standard
# workaround for that free-tier behavior; on a paid Render plan it's unnecessary but
# harmless.
#
# Each run logs a timestamped, human-readable line either way — "ALIVE — HTTP 200 in
# 0.31s — body: {...}" or "DOWN or UNREACHABLE — HTTP <code> in <time>s" — and a genuine
# ping failure marks the run itself as failed (a real red X in the Actions tab, not just
# text buried in a log that always shows green). GitHub emails failed-scheduled-workflow
# notifications to the repo's default notification recipients, so this is also your actual
# alerting for "the backend is down," not just record-keeping. One isolated failure right
# after a cold start can be normal (Render still waking the service up); repeated failures
# across runs are the real signal.
#
# Setup (one-time, after the backend is actually deployed to Render):
#   Repo Settings -> Secrets and variables -> Actions -> Variables -> New repository
#   variable, name RENDER_APP_URL, value the deployed backend's base URL with no
#   trailing slash (e.g. https://gst-billing-backend.onrender.com). Until that variable
#   is set, every run of this workflow just logs that and exits successfully — it does not
#   fail the workflow or send requests anywhere.
name: Keep Render backend awake

on:
  schedule:
    # Cron doesn't divide 60 evenly by 14, so the gap from :56 to the next hour's :00 is
    # only 4 minutes rather than 14 — harmless (a slightly-early extra ping), and still
    # guarantees the real constraint: no gap ever exceeds 14 minutes, safely under
    # Render's 15-minute idle threshold. GitHub's own scheduler can run a few minutes late
    # under load; 14 (not 15) was chosen to leave that margin, not because the interval
    # needs to be exact.
    - cron: '*/14 * * * *'
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab to test setup

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

          if [ -z "$RENDER_APP_URL" ]; then
            echo "[$(ts)] SKIPPED — RENDER_APP_URL repository variable is not set yet. See this file's header comment for setup."
            exit 0
          fi

          # -o writes the body to a file (so it can be logged) while -w prints status code
          # and elapsed time to stdout, joined with '|' so one curl call yields both without
          # a second request. `|| RESULT="000|0"` covers curl itself failing outright (DNS
          # failure, connection refused, timeout) rather than the server returning a bad
          # status — %{http_code} would otherwise be empty in that case.
          RESULT=$(curl -s --max-time 30 -o /tmp/health_body.json -w '%{http_code}|%{time_total}' "$RENDER_APP_URL/health") || RESULT="000|0"
          HTTP_CODE="${RESULT%%|*}"
          TIME_TOTAL="${RESULT##*|}"
          BODY=$(cat /tmp/health_body.json 2>/dev/null || echo "(no body)")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "[$(ts)] ALIVE — HTTP $HTTP_CODE in ${TIME_TOTAL}s — body: $BODY"
          else
            echo "[$(ts)] DOWN or UNREACHABLE — HTTP ${HTTP_CODE:-000} in ${TIME_TOTAL}s"
            echo "A single failure right after a cold start can be normal (Render waking the service back up); repeated failures across runs are the real signal something's wrong."
            exit 1
          fi
