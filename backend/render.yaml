# render.yaml — Render Blueprint for the backend web service (Section 12).
# If Puppeteer fails to launch Chromium on Render's default Node runtime (missing
# system libraries — a known issue this spec flags explicitly), switch `runtime` below
# to `docker` — the Dockerfile in this same folder installs everything Chromium needs.
services:
  - type: web
    name: gst-billing-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    # GET /health (index.js — the one deliberate exception to this API's POST-only
    # convention) — Render pings this to decide whether the service is up. Separate from,
    # but complementary to, the .github/workflows/keep-alive.yml scheduled ping that exists
    # specifically to stop the free plan's 15-minutes-idle auto-sleep from kicking in at all.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CLIENT_URL
        sync: false
      - key: EWAYBILL_THRESHOLD
        value: 50000
      - key: LOG_LEVEL
        value: info
