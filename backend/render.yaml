# render.yaml — Render Blueprint for the backend web service (Section 12).
# `runtime: docker` (switched 2026-09-16) — PDF generation hit exactly the failure this
# file used to warn about: Puppeteer's bundled Chromium couldn't launch on Render's default
# Node runtime (missing system libraries), 500ing every `/invoices/pdf` call in production.
# The Dockerfile in this same folder installs everything Chromium needs; Render builds from
# it automatically once `runtime` is `docker` — no buildCommand/startCommand here anymore,
# the Dockerfile's own RUN npm install / CMD ["node", "index.js"] replace them.
services:
  - type: web
    name: gst-billing-backend
    runtime: docker
    plan: free
    # GET /health (index.js — the one deliberate exception to this API's POST-only
    # convention) — Render pings this to decide whether the service is up. Separate from,
    # but complementary to, the .github/workflows/keep-alive.yml scheduled ping that exists
    # specifically to stop the free plan's 15-minutes-idle auto-sleep from kicking in at all.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CLIENT_URL
        sync: false
      - key: EWAYBILL_THRESHOLD
        value: 50000
      - key: LOG_LEVEL
        value: info
